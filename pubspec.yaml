name: fitness_app
description: "Ali's Personal Fitness App - 5K & Half Marathon Training"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: 2.5.1
  google_fonts: ^6.2.1
  phosphoricons_flutter: ^1.1.0
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.2
  share_plus: ^9.0.0
  file_picker: ^8.0.5
  intl: ^0.19.0
  uuid: ^4.4.0
  sqflite_common_ffi_web: ^0.4.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/plan.json
    - assets/workouts.json
