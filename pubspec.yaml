name: fitness_app
description: "Ali's Personal Fitness App - 5K & Half Marathon Training"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.4.3
  google_fonts: ^9.0.0
  phosphor_flutter: ^2.1.0
  sqflite: ^2.4.5
  path_provider: ^2.1.6
  path: ^1.9.1
  fl_chart: ^1.3.0
  flutter_local_notifications: ^22.3.3
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  intl: ^0.20.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/plan.json
    - assets/workouts.json
